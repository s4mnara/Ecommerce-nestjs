name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Build Images
        run: |
          docker build -t frontend:latest -f frontend/Dockerfile frontend
          docker build -t backend:latest -f api/Dockerfile api

      - name: Save Images
        run: |
          docker save -o frontend.tar frontend:latest
          docker save -o backend.tar backend:latest
          ls -lh *.tar

      - name: Prepare EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/app"

      - name: Transfer Images
        run: |
          scp -o StrictHostKeyChecking=no *.tar ${{ secrets.EC2_USER }}@${{ secrets. EC2_HOST }}:~/app/

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd ~/app
          docker stop frontend backend 2>/dev/null || true
          docker rm frontend backend 2>/dev/null || true
          docker load -i frontend.tar
          docker load -i backend.tar
          docker run -d --name frontend --restart unless-stopped -p 80:80 frontend:latest
          docker run -d --name backend --restart unless-stopped -p 3000:3000 backend:latest
          rm -f *.tar
          docker ps
          EOF
