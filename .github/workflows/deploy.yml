name: Deploy to EC2

on:   
  push:  
    branches:  [main]

jobs:   
  deploy: 
    runs-on: self-hosted
    
    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name: Set project name
        run: echo "COMPOSE_PROJECT_NAME=ecommerce-nestjs" >> $GITHUB_ENV

      - name: Create backend .env
        run: |
          PUBLIC_IP=$(curl -s http://checkip.amazonaws.com)
          
          cat > api/.env << EOF
          PORT=3000
          NODE_ENV=production
          DB_HOST=loja_db
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=loja_db
          JWT_SECRET=seuSegredoAqui
          JWT_EXPIRES_IN=7d
          APP_NAME=api-loja
          LOG_LEVEL=info
          REDIS_HOST=loja_redis
          REDIS_PORT=6379
          FRONTEND_URL=http://$PUBLIC_IP:3000
          EOF
          
          echo "=== Backend .env criado ==="
          cat api/.env

      - name: Create frontend . env
        run: |
          PUBLIC_IP=$(curl -s http://checkip.amazonaws.com)
          echo "REACT_APP_API_URL=http://$PUBLIC_IP:8080" > frontend/.env
          
          echo "=== Frontend .env criado ==="
          cat frontend/.env

      - name: Stop old containers
        run: |
          docker-compose -p ecommerce-nestjs down || true
          docker ps -a --filter "name=loja_" -q | xargs docker stop 2>/dev/null || true
          docker ps -a --filter "name=loja_" -q | xargs docker rm 2>/dev/null || true

      - name: Clean ports
        run: |
          sudo lsof -ti:3000 | xargs sudo kill -9 2>/dev/null || true
          sudo lsof -ti:8080 | xargs sudo kill -9 2>/dev/null || true
          sleep 5

      - name: Build and start services
        run: |
          docker-compose -p ecommerce-nestjs up -d --build --force-recreate

      - name: Wait for services
        run:  |
          echo "Aguardando serviços iniciarem..."
          sleep 30

      - name: Check health
        run: |
          echo "=== Status dos Containers ==="
          docker ps --filter "name=loja_"
          echo ""
          echo -n "PostgreSQL: "
          docker exec loja_db pg_isready -U postgres && echo "✅ Ready" || echo "⚠️ Not ready"
          echo -n "Redis: "
          docker exec loja_redis redis-cli ping && echo "✅ Ready" || echo "⚠️ Not ready"
          echo -n "API: "
          curl -s http://localhost:8080 && echo "✅ Ready" || echo "⚠️ Not ready"
          echo -n "Frontend: "
          curl -s http://localhost:3000 && echo "✅ Ready" || echo "⚠️ Not ready"

      - name: Show logs
        if: always()
        run: |
          echo "=== API Logs ==="
          docker logs loja_api --tail=30
          echo ""
          echo "=== Frontend Logs ==="
          docker logs loja_frontend --tail=20
          echo ""
          echo "=== Database Logs ==="
          docker logs loja_db --tail=10

      - name:  Cleanup old images
        run:  |
          docker image prune -af --filter "until=24h"

      - name: Deployment info
        run: |
          PUBLIC_IP=$(curl -s http://checkip.amazonaws.com)
          echo "========================================"
          echo "🚀 Deploy Completo!"
          echo "========================================"
          echo "Frontend:  http://$PUBLIC_IP:3000"
          echo "Backend:   http://$PUBLIC_IP:8080"
          echo "========================================"
          docker ps --filter "name=loja_" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"