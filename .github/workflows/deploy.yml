name: CI/CD Deploy NestJS Docker (Frontend + Backend)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Build Frontend Docker image
        run: docker build -t frontend:latest -f frontend/Dockerfile frontend

      - name: Save Frontend Docker image as tar
        run: docker save frontend:latest -o frontend.tar

      - name: Build Backend Docker image
        run: docker build -t backend:latest -f api/Dockerfile api

      - name: Save Backend Docker image as tar
        run: docker save backend:latest -o backend.tar

      - name: Create app directory on EC2
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /home/ubuntu/app"

      - name: Copy Docker images to EC2
        run: scp -C frontend.tar backend.tar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/

      - name: Load and run Docker images on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd /home/ubuntu/app
            docker load -i frontend.tar
            docker stop frontend || true
            docker rm frontend || true
            docker run -d --name frontend -p 80:80 frontend:latest
            docker load -i backend.tar
            docker stop backend || true
            docker rm backend || true
            docker run -d --name backend -p 3000:3000 backend:latest
            rm -f frontend.tar backend.tar
            docker ps -a
            docker images
          EOF

