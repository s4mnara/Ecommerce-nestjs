name: CI/CD Deploy NestJS Docker (Frontend + Backend)

on:
  push:
    branches: 
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Build Frontend Image
        run: |
          docker build -t frontend:latest -f frontend/Dockerfile frontend

      - name: Build Backend Image
        run: |
          docker build -t backend:latest -f api/Dockerfile api

      - name: Save Frontend Image
        run: |
          docker save -o frontend.tar frontend:latest

      - name: Save Backend Image
        run: |
          docker save -o backend.tar backend:latest

      - name:  Verify tar files
        run: |
          ls -lh *.tar
          file frontend.tar backend.tar

      - name: Create app directory on EC2
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/app"

      - name: Copy Docker images to EC2
        run: |
          scp -o StrictHostKeyChecking=no frontend.tar backend.tar "${{ secrets.EC2_USER }}@${{ secrets. EC2_HOST }}:~/app/"

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets. EC2_USER }}@${{ secrets.EC2_HOST }}" bash << 'ENDSSH'
            set -e
            cd ~/app
            
            echo "==> Parando containers antigos..."
            docker stop frontend backend 2>/dev/null || true
            docker rm frontend backend 2>/dev/null || true
            
            echo "==> Carregando imagens Docker..."
            docker load -i frontend.tar
            docker load -i backend.tar
            
            echo "==> Removendo imagens antigas..."
            docker image prune -f
            
            echo "==> Iniciando novos containers..."
            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 80:80 \
              frontend:latest
            
            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 3000:3000 \
              backend:latest
            
            echo "==> Limpando arquivos temporários..."
            rm -f frontend.tar backend.tar
            
            echo "==> Status dos containers:"
            docker ps -a
            
            echo "==> Deploy concluído com sucesso!"
          ENDSSH

