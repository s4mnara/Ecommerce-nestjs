name: Deploy to EC2

on:
  push: 
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses:  actions/checkout@v4

      - name: Create backend .env with secrets
        run: |
          cat > api/.env << 'EOF'
          PORT=3000
          NODE_ENV=production
          DB_HOST=db
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_DATABASE=loja_db
          JWT_SECRET=${{ secrets. JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          APP_NAME=api-loja
          LOG_LEVEL=info
          REDIS_HOST=loja_redis
          REDIS_PORT=6379
          EOF

      - name: Create frontend .env
        run: |
          PUBLIC_IP=$(curl -s http://checkip.amazonaws.com)
          cat > frontend/.env << EOF
          REACT_APP_API_URL=http://\$PUBLIC_IP:8080
          EOF

      - name: Stop old containers
        run: |
          docker-compose down || true

      - name: Build and start services
        run: |
          docker-compose up -d --build

      - name: Wait for services
        run: |
          echo "Aguardando serviços iniciarem..."
          sleep 20

      - name: Check health
        run: |
          docker-compose ps
          docker exec loja_db pg_isready -U postgres || echo "⚠️ Database not ready"
          docker exec loja_redis redis-cli ping || echo "⚠️ Redis not ready"

      - name: Show logs
        run: |
          docker-compose logs --tail=30

      - name: Cleanup
        run: |
          docker image prune -f

      - name:  Deployment info
        run: |
          PUBLIC_IP=$(curl -s http://checkip.amazonaws.com)
          echo "================================"
          echo "🚀 Deploy Completo!"
          echo "================================"
          echo "Frontend:  http://$PUBLIC_IP:3000"
          echo "Backend:   http://$PUBLIC_IP:8080"
          echo "================================"