name: CI/CD Deploy NestJS Docker (Frontend + Backend)

on:
  push:
    branches: 
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout repo
        uses: actions/checkout@v3

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_KEY }}

      - name: Build and Save Frontend
        run: |
          docker build -t frontend:latest -f frontend/Dockerfile frontend
          docker save frontend: latest -o frontend.tar

      - name: Build and Save Backend
        run: |
          docker build -t backend:latest -f api/Dockerfile api
          docker save backend:latest -o backend.tar

      - name: Copy files to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets. EC2_HOST }} "mkdir -p ~/app"
          scp -o StrictHostKeyChecking=no frontend.tar backend.tar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets. EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'EOF'
            set -e
            cd ~/app
            
            echo "Limpando containers antigos..."
            docker stop frontend backend 2>/dev/null || true
            docker rm frontend backend 2>/dev/null || true
            
            echo "Carregando imagens..."
            docker load -i frontend.tar
            docker load -i backend.tar
            
            echo "Iniciando novos containers..."
            docker run -d --name frontend -p 80:80 --restart unless-stopped frontend:latest
            docker run -d --name backend -p 3000:3000 --restart unless-stopped backend:latest
            
            echo "Limpando arquivos temporários..."
            rm -f frontend.tar backend. tar
            
            echo "Status dos containers:"
            docker ps -a
          EOF


